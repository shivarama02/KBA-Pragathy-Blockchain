<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course</title>
</head>
<body>
    <table bgcolor="F0BDE0" width="100%" cellspacing="8">
        <tr>
            <td align="left">
                <img src="kbalogo.png" alt="kbalogo" height="50" width="50">
            </td>
            <td align="right">
                <a href="home.html">Home |</a>
                <a href="courses.html">Courses |</a>
                <a href="contactus.html">Contact Us |</a>
                <a href="addcourse.html">Add Course |</a>
                <a href="login.html">Logout |</a>
            </td>
        </tr>
    </table>
    <br><br><br>
    <center>
        <form action="courses.html">
            <table bgcolor="F0BDE0" cellspacing="30">
                <tr>
                    <td colspan="2" align="center">
                        <h1>Add Course</h1>
                    </td>
                </tr>
                <tr>
                    <td>Course Name : </td>
                    <td>
                        <input type="text" placeholder="Enter course name "required>
                    </td>
                </tr>
                <tr>
                    <td>Course ID : </td>
                    <td>
                        <input type="text" placeholder="Enter course ID" required>
                    </td>
                </tr>
                <tr>
                    <td>Course Type : </td>
                    <td>
                        <select name="course" required>
                            <option value="c1">Self-placed</option>
                            <option value="c2">Aidded</option>
                            <option value="c3">Govt</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Description : </td>
                    <td>
                        <textarea rows="5" cols="30" placeholder="Enter a brief description"></textarea>
                    </td>
                </tr>
                <tr>
                    <td>Price : </td>
                    <td>
                        <select name="price">
                            <option value="p1">5000</option>
                            <option value="p2">7000</option>
                            <option value="p3">8000</option>
                            <option value="p4">10000</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Add Course">
                    </td>
                </tr>
            </table>
        </form>
    </center>
</body>
</html>
