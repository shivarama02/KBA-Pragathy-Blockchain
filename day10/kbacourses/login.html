<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body{
            background-color: #F0BDE0;
            display: flex;
            justify-content: center;
            align-items: center;
        } 
        .login{
            background-color: #ffffff;
            padding: 20px;
            margin-top: 150px;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 5px 10px rgb(111, 108, 108);
        }
        h1{
            text-align: center;
            color: #9333EA;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        label{
            display: block;
            margin: 10px 0px;        
        }
        .intp{
            padding: 10px;
            border: 1px solid;
            border-radius: 5px;
            box-sizing: border-box;
            width: 100%;
        }
        .log{
            display: flex;
            justify-content: space-between;
            margin: 20px 0px;
        }
        .submit{
            background-color: #9333EA;
            padding: 10px 30px;
            color: white;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
        }
        a{
            text-decoration: none;
            padding: 10px 0px;
            color: #9333EA;
        }
        .btxt{
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login">
        <form action="home.html">
        <div>
            <h1>Login</h1>

            <label for="email">Email :</label>
            <input class="intp" type="email" id="email" placeholder="Enter your email">
            
            <label for="password">Password : </label>
            <input class="intp" type="password" id="password" placeholder="Enter your passowrd">
            <div class="log">
                <input class="submit" type="submit" value="Login">
                <a href="Forgotpass.html">Forgot Password?</a>
            </div>
            
            <div class="btxt">
                Don't have an Account? <a href="signup.html">Sign Up</a>
            </div>
        </div>
        </form>
    </div>
</body>
</html>
