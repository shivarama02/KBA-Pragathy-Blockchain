<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Books</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div>
            <img src="./images/booklogo.png" alt="kbalogo">
        </div>
        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="Viewbooks.html">Books</a></li>
            <li><a href="Addbooks.html">Add Book</a></li>
            <li><a href="login.html">Logout</a></li>
        </ul>
    </nav>
    <div class="main">
        <div class="main1">
            <form action="Viewbooks.html">
                <div>
                    <h1>Edit Book</h1>
                    
                    <label for="">Title</label>
                    <input class="intp" type="text" placeholder="Enter title here" required>

                    <label for="">Author</label>
                    <input class="intp" type="text" placeholder="Enter author name" required>

                    <label for="">ISBN</label>
                    <input class="intp" type="text" placeholder="Enter ISBN Number" required>

                    <label for="">Category</label>
                    <select name="category" required>
                        <option value="c1">Fiction</option>
                        <option value="c2">Non-Fiction</option>
                        <option value="c3">Academic</option>
                        <option value="c4">Poetry</option>
                        <option value="c5">Children</option>
                        <option value="c6">Travel</option>
                        <option value="cccccc7">Cultural</option>
                    </select>

                    <div class="bttn">
                        <input class="btn1" type="submit" value="Update Book">
                        <input class="btn2" type="reset" value="Cancel">
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
