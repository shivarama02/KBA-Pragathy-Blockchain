<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Books</title>
</head>
<body>
    <table bgcolor="B3DAFD" width="100%" cellpadding="10">
        <tr>
            <td>
                <img src="./images/booklogo.png" alt="booklogo" height="30" width="30">
            </td>
            <td align="right">
                <a href="home.html">Home |</a>
                <a href="Viewbooks.html">Books |</a>
                <a href="Addbooks.html">Add Book |</a>
                <a href="Login.html">Logout |</a>
            </td>
        </tr>
    </table>
    <br><br><br><br>
    <center>
        <form action="Viewbooks.html">
            <table bgcolor="B3DAFD" cellspacing="30">
                <tr>
                    <td colspan="2" align="center">
                        <h1>Add Book</h1>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="">Title</label>
                    </td>
                    <td>
                        <input type="text" placeholder="Enter title here" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Author</label>
                </td>
                <td>
                    <input type="text" placeholder="Enter author name" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">ISBN</label>
                </td>
                <td>
                    <input type="text" placeholder="Enter ISBN Number" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Category</label>
                </td>
                <td>
                    <select name="category" required>
                        <option value="c1">Fiction</option>
                        <option value="c2">Non-Fiction</option>
                        <option value="c3">Academic</option>
                        <option value="c4">Poetry</option>
                        <option value="c5">Children</option>
                        <option value="c6">Travel</option>
                        <option value="cccccc7">Cultural</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="reset" value="Cancel">
                    <input type="submit" value="Add Book">
                </td>
            </tr>
        </table>
    </form>
    </center>
</body>
</html>
