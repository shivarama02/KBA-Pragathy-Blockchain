<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main1">
        <div class="main">
            <div class="top">
                <div class="amazon">
                    <span>Amazon Basics</span>
                    <span>112 STEPS CHECK & CORRECT</span>
                </div>
                <div class="screen">
                    <span class="step-count">01</span>
                    <span class="display">123456789012</span>
                </div>
                <div class="digit">
                    <span>12-DIGIT</span>
                <span>555</span>
                <div class="power-spec">
                    <span class="power-badge">2POWER</span>
                    <span class="power-icon">☼</span>
                    <span class="power-icon">⊙</span>
                </div>
            </div>
        </div>
        <div class="mid">
            <div class="top-controls">
                <button class="btn btn-cyan btn-top">
                    <span class="lbl-check">CHECK</span>
                    <span>⟵</span>
                </button>
                <button class="btn btn-cyan btn-top">
                    <span class="lbl-check">CHECK</span>
                    <span>⟶</span>
                </button>
                <button class="btn btn-dark btn-top">
                    <span class="lbl-auto">CORRECT</span>
                    <div class="correct-box">
                        <span>x</span>
                        <span>00→0</span>
                    </div>
                </button>
                <button class="btn btn-dark btn-top">
                    <span class="lbl-auto">AUTO</span>
                    <span class="lbl-auto">REPLAY</span>
                </button>
            </div>
            <button class="solar">
                <span></span><span></span><span></span><span></span>
            </button>
        </div>
        <div class="bottom">
            <button class="btn btn-dark">
                    <span class="lbl-title">RATE</span>
                    </button>
                    <button class="btn btn-gray">
                        <span class="num">7</span>
                    </button>
                    <button class="btn btn-gray">
                        <span class="num">8</span>
                    </button>
                    <button class="btn btn-gray">
                        <span class="num">9</span>
                    </button>
                    <button class="btn btn-dark">
                        <span class="lbl-op">√</span>
                    </button>
                    <button class="btn btn-dark">
                        <span class="lbl-op">%</span>
                    </button>
                    <button class="btn btn-orange">
                        <span class="lbl-title">ON/C</span>
                    </button>
                    
                    <button class="btn btn-dark">
                        <span class="lbl-title">-GST</span>
                        <span class="lbl-sub">REC</span>
                    </button>
                    <button class="btn btn-gray">
                        <span class="num">4</span>
                    </button>
                    <!-- '5' Key with Tactile Ring -->
                    <button class="btn btn-gray">
                        <div class="tactile-ring"></div>
                        <span class="num">5</span>
                    </button>
                    <button class="btn btn-gray">
                        <span class="num">6</span>
                    </button>
                    <button class="btn btn-dark">
                        <span class="lbl-op">×</span>
                    </button>
                    <button class="btn btn-dark">
                        <span class="lbl-op">÷</span>
                    </button>
                    <button class="btn btn-dark">
                        <span class="lbl-title">MRC</span>
                    </button>

                    <button class="btn btn-dark">
                        <span class="lbl-title">+GST</span>
                        <span class="lbl-sub">SET</span>
                    </button>
                    <button class="btn btn-gray">
                        <span class="num">1</span>
                    </button>
                    <button class="btn btn-gray">
                        <span class="num">2</span>
                    </button>
                    <button class="btn btn-gray">
                        <span class="num">3</span>
                    </button>
                    <button class="btn btn-dark plus-key">
                        <span class="lbl-op">+</span>
                    </button>
                    <button class="btn btn-dark">
                        <span class="lbl-op">-</span>
                    </button>
                    <button class="btn btn-dark">
                        <span class="lbl-title">M=</span>
                    </button>
                    
                    <button class="btn btn-dark">
                        <span class="lbl-title">MU</span>
                    </button>
                    <button class="btn btn-gray">
                        <span class="num">0</span>
                    </button>
                    <button class="btn btn-gray">
                        <span class="num">00</span>
                    </button>
                    <button class="btn btn-gray">
                        <span class="num">.</span>
                    </button>
                    <button class="btn btn-dark">
                        <span class="lbl-op">=</span>
                    </button>
                    <button class="btn btn-dark">
                        <span class="lbl-title">M±</span>
                    </button>
        </div>  
    </div>
</body>
</html>
