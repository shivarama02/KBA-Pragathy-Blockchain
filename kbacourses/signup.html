
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="flex items-center justify-center bg-[#F0BDE0]">
    <div class="mt-[150px] w-[400px] rounded-[10px] bg-white p-[20px] shadow-[0_5px_10px_rgb(111,108,108)]">
        <form action="home.html">
            <div>
                <h1 class="text-center font-[Verdana,Geneva,Tahoma,sans-serif] text-[#9333EA] text-3xl font-bold">Sign Up</h1>

                <label for="name" class="my-[10px] block">Full Name :</label>
                <input class="box-border w-full rounded-[5px] border border-black p-[10px]" type="text" id="name" placeholder="Enter your name" required>

                <label for="email" class="my-[10px] block">Email :</label>
                <input class="box-border w-full rounded-[5px] border border-black p-[10px]" type="email" id="email" placeholder="Enter your email" required>

                <label for="password" class="my-[10px] block">Password :</label>
                <input class="box-border w-full rounded-[5px] border border-black p-[10px]" type="password" id="password" placeholder="Enter your password" required>

                <label for="role" class="my-[10px] block">Role :</label>
                <select name="role" id="role" class="box-border w-full rounded-[5px] border border-black p-[10px]" required>
                    <option value="r1">Admin</option>
                    <option value="r2">User</option>
                </select>

                <div class="my-[20px] flex justify-start">
                    <input class="rounded-[10px] bg-[#9333EA] px-[30px] py-[10px] text-[15px] text-white" type="submit" value="Sign Up">
                </div>

                <div class="text-center">
                    Already have an Account?
                    <a href="login.html" class="py-[10px] text-[#9333EA] no-underline">Login</a>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
