
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex items-center justify-center bg-[#F0BDE0]">
    <div class="mt-[150px] w-[400px] rounded-[10px] bg-white p-[20px] shadow-[0_5px_10px_rgb(111,108,108)]">
        <form action="home.html">
            <h1 class="text-center font-[Verdana,Geneva,Tahoma,sans-serif] text-[#9333EA] text-3xl font-bold">Login</h1>

            <label for="email" class="my-[10px] block">Email :</label>
            <input class="box-border w-full rounded-[5px] border border-black p-[10px]" type="email" id="email" placeholder="Enter your email">

            <label for="password" class="my-[10px] block">Password :</label>
            <input class="box-border w-full rounded-[5px] border border-black p-[10px]" type="password" id="password" placeholder="Enter you password">

            <div class="my-[20px] flex justify-between">
                <input class="cursor-pointer rounded-[10px] bg-[#9333EA] px-[30px] py-[10px] text-[15px] text-white" type="submit" value="Login">
                <a href="Forgotpass.html" class="py-[10px] text-[#9333EA] no-underline">Forgot Password?</a>
            </div>

            <div class="text-center">
                Don't have an Account?
                <a href="signup.html" class="py-[10px] text-[#9333EA] no-underline">Sign Up</a>
            </div>
        </form>
    </div>
</body>
</html>
