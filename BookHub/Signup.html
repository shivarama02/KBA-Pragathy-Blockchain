<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body class="signlog">
    <div class="login">
        <form action="login.html">
        <div>
            <h1>Book<span>Hub</span></h1>
            <h2>Sign Up</h2>

            <label for="name">Full Name :</label>
            <input class="intp" type="text" id="name" placeholder="Enter your full name" required>

            <label for="email">Email :</label>
            <input class="intp" type="email" id="email" placeholder="Enter your email" required>

            <label for="password">Password : </label>
            <input class="intp" type="password" id="password" placeholder="Enter your passowrd" required>

            <label for="Phone">Phone : </label>
            <input class="intp" type="Phone" id="Phone" placeholder="Enter your Phone Number" required>
            
            <label for="role">Role : </label>
            <select name="role" id="role" required>
                <option value="r1">Librarian</option>
                <option value="r2">Member</option>
            </select>

            <div class="log">
                <input class="submit" type="submit" value="Sign Up">
            </div>
            
            <div class="btxt">
                Already have an Account? <a href="login.html">Login</a>
            </div>
        </div>
        </form>
    </div>
</body>
</html>
