<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="style1.css"> -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#00a6ff9e] flex justify-center items-center">
    <div class="bg-white p-5 mt-[50px] w-100 rounded-[10px] shadow-[10px_10px_2px_#515050]">
        <form action="login.html">
        <div>
            <h1 class="text-center text-black font-[Verdana,Geneva,Tahoma,sans-serif] text-[30px] font-bold">Book<span class="text-[#00b3ff]">Hub</span></h1>
            <h2 class="text-center text-black font-[Verdana,Geneva,Tahoma,sans-serif] font-bold">Sign Up</h2>

            <label class="block my-[10px]" for="name">Full Name :</label>
            <input class="p-[10px] border border-solid rounded-[5px] box-border w-full" type="text" id="name" placeholder="Enter your full name" required>

            <label class="block my-[10px]" for="email">Email :</label>
            <input class="p-[10px] border border-solid rounded-[5px] box-border w-full" type="email" id="email" placeholder="Enter your email" required>

            <label class="block my-[10px]" for="password">Password : </label>
            <input class="p-[10px] border border-solid rounded-[5px] box-border w-full" type="password" id="password" placeholder="Enter your passowrd" required>

            <label class="block my-[10px]" for="Phone">Phone : </label>
            <input class="p-[10px] border border-solid rounded-[5px] box-border w-full" type="Phone" id="Phone" placeholder="Enter your Phone Number" required>
            
            <label class="block my-[10px]" for="role">Role : </label>
            <select  class="p-[10px] border border-solid rounded-[5px] box-border w-full" name="role" id="role" required>
                <option value="r1">Librarian</option>
                <option value="r2">Member</option>
            </select>

            <div class="my-[20px]">
                <input class="bg-[#00b3ff] px-[50px] py-[10px] text-white text-[15px] rounded-[20px] cursor-pointer" type="submit" value="Sign Up">
            </div>
            
            <div class="text-center">
                Already have an Account? <a href="login.html" class="text-[#00b3ff]">Login</a>
            </div>
        </div>
        </form>
    </div>
</body>
</html>
