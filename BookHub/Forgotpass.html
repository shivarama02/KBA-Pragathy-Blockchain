<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #171717;
            font-family: Arial, sans-serif;
        }

        .meme-card {
            max-width: 360px;
            margin: 20px;
            padding: 28px;
            color: #f5f5f5;
            text-align: center;
            background: #262626;
            border: 2px solid #525252;
            border-radius: 16px;
            box-shadow: 6px 6px 0 #000;
        }

        .meme-card h1 {
            margin-top: 0;
            color: #facc15;
            font-size: 24px;
        }

        .meme-card p {
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="meme-card">
        <h1>Account Status: Haunted 👻</h1>
        <p>Forgot your password? Same. It vanished without a trace, leaving only this awkward page and my last two brain cells arguing about it. 🪦</p>
    </div>
</body>
</html>
