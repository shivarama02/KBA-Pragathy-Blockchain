<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course</title>
</head>
<body bgcolor="cyan">
    <center>
        <h1>Add course</h1>
        <form action="list.html">
            <table cellspacing="30">
                <tr>
                    <td>Course Name : </td>
                    <td>
                        <Input type="text" placeholder="Enter Course Name" required>
                    </td>
                </tr>
                <tr>
                    <td>Course ID : </td>
                    <td>
                        <input type="text" placeholder="Enter Course ID" Required>
                    </td>
                </tr>
                <tr>
                    <td>Course Type : </td>
                    <td>
                        <select name="courses" required>
                            <option value="c1">Course 1</option>
                            <option value="c2">Course 2</option>
                            <option value="c3">Course 3</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Description : </td>
                    <td>
                        <textarea rows="5" cols="30" placeholder="Enter a brief Description" required></textarea>
                    </td>
                </tr>
                <tr>
                    <td>Price : </td>
                    <td>
                        <select name="price" required>
                            <option value="p1">5000</option>
                            <option value="p2">7000</option>
                            <option value="p3">8000</option>
                            <option value="p4">10000</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Education : </td>
                    <td>
                        <input type="checkbox" value="UG" name="edu">UG
                        <input type="checkbox" value="PG" name="edu">PG
                        <input type="checkbox" value="Diploma" name="edu">Diploma
                    </td>
                </tr>
                <tr>
                    <td>Gender : </td>
                    <td>
                        <input type="radio" name="Gender" value="Male">Male
                        <input type="radio" name="Gender" value="Female">Female
                        <input type="radio" name="Gender" value="Others">Others
                    </td>
                </tr>
                <tr>
                    <td>Email : </td>
                    <td>
                        <input type="email" placeholder="Enter a mail id" required>
                    </td>
                </tr>
                <tr>
                    <td>Password : </td>
                    <td>
                        <input type="password" placeholder="Enter a password" required>
                    </td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <input type="Submit" value="Submit">
                        <input type="Reset" value="Reset">
                    </td>
                </tr>
                
            </table>
        </form>
    </center>
</body>
</html>
